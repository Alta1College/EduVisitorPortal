upload_max_filesize=20M
post_max_size=25M
memory_limit=256M
max_execution_time=120
opcache.enable=1
opcache.enable_cli=0
; Fork: the production image never changes its code at run time, so PHP need not check files
; for changes on every request (the development image uses docker/apache instead).
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
